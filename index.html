<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vaibhvi Srivastav | Data Analyst</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --text: #222;
      --card: #ffffff;
      --accent: #4f46e5;
    }

    body.dark {
      --bg: #0f172a;
      --text: #e5e7eb;
      --card: #1e293b;
      --accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 2.5rem 1rem;
      text-align: center;
      background: linear-gradient(135deg, var(--accent), #22c55e);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header button {
      margin-top: 1rem;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 3rem 1.2rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
    }

    .skills-grid, .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
