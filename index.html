<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaibhvi Srivastav | Data Analyst</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --bg:#0b1220;
  --surface:#111827;
  --card:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#c9a24d;
  --border:#2b3446;
}

*{
  box-sizing:border-box;
  font-family:Inter,Segoe UI,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
}

/* ===== NAV ===== */
nav{
  position:sticky;
  top:0;
  background:rgba(11,18,32,.9);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  z-index:10;
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nav-inner strong{
  letter-spacing:.4px;
}

.nav-inner a{
  margin-left:22px;
  color:var(--muted);
  text-decoration:none;
  font-size:.95rem;
}

.nav-inner a:hover{
  color:var(--accent);
}

/* ===== HERO ===== */
.hero{
  max-width:1200px;
  margin:auto;
  padding:90px 24px 70px;
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:60px;
}

.hero h1{
  font-size:3.1rem;
  line-height:1.15;
  margin-bottom:18px;
}

.hero p{
  color:var(--muted);
  max-width:540px;
}

.hero-actions{
  margin-top:30px;
  display:flex;
  gap:16px;
}

.btn{
  padding:12px 22px;
  border-radius:12px;
  text-decoration:none;
  border:1px solid var(--border);
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:10px;
}

.btn.primary{
  background:var(--accent);
  color:#111827;
  border:none;
  font-weight:600;
}

.btn:hover{
  transform:translateY(-2px);
}

/* ===== STATS ===== */
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.stat{
  background:var(--surface);
  border:1px solid var(--border);
  padding:22px;
}

.stat span{
  display:block;
  font-size:.8rem;
  color:var(--muted);
}

.stat strong{
  font-size:1.1rem;
}

/* ===== SECTIONS ===== */
section{
  max-width:1200px;
  margin:auto;
  padding:70px 24px;
  border-top:1px solid var(--border);
}

section h2{
  font-size:2rem;
  margin-bottom:40px;
}

/* ===== SKILLS ===== */
.skills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:24px;
}

.skill{
  background:var(--card);
  border:1px solid var(--border);
  padding:22px;
  display:flex;
  align-items:center;
  gap:14px;
}

.skill i{
  color:var(--accent);
  font-size:1.4rem;
}

/* ===== PROJECTS ===== */
.project{
  margin-bottom:70px;
}

.project-head{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:40px;
  margin-bottom:20px;
}

.project p{
  color:var(--muted);
}

iframe{
  width:100%;
  height:520px;
  border:none;
  background:#000;
}

/* ===== CONTACT ===== */
.contact{
  text-align:center;
}

.contact a{
  color:var(--accent);
  text-decoration:none;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:28px;
  color:var(--muted);
  font-size:.9rem;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
  }
  .project-head{
    grid-template-columns:1fr;
  }
}
</style>
</head>

      </a>
    </div>
  </div>
